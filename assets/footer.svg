<svg width="1600" height="200" viewBox="0 0 1600 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0A0B10"/>
      <stop offset="100%" stop-color="#0D0E16"/>
    </linearGradient>
    <linearGradient id="hairline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#6E7BFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#6E7BFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6E7BFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="fGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#6E7BFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6E7BFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="fBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1600" height="200" fill="url(#fBgGrad)"/>

  <!-- ambient glow, very quiet -->
  <circle cx="800" cy="20" r="220" fill="url(#fGlow)" filter="url(#fBlur)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="10s" repeatCount="indefinite"/>
  </circle>

  <!-- top hairline border with a slow traveling highlight -->
  <line x1="0" y1="0" x2="1600" y2="0" stroke="#6E7BFF" stroke-opacity="0.08" stroke-width="1"/>
  <rect x="-300" y="-1" width="300" height="2" fill="url(#hairline)">
    <animate attributeName="x" values="-300;1600;-300" dur="16s" repeatCount="indefinite"/>
  </rect>

  <!-- faint drifting particles, sparse -->
  <g fill="#AEB0B8">
    <circle cx="220" cy="60" r="1.3" opacity="0.25"><animate attributeName="opacity" values="0.05;0.4;0.05" dur="13s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="1380" cy="150" r="1.5" opacity="0.25"><animate attributeName="opacity" values="0.05;0.4;0.05" dur="15s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="1500" cy="55" r="1.2" opacity="0.25"><animate attributeName="opacity" values="0.05;0.35;0.05" dur="11s" begin="4s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="140" r="1.4" opacity="0.25"><animate attributeName="opacity" values="0.05;0.4;0.05" dur="14s" begin="1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- one small orbiting point, echoing the hero -->
  <g transform="translate(1460,100)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="50s" repeatCount="indefinite"/>
      <circle cx="16" cy="0" r="1.6" fill="#D9B26A" opacity="0.6"/>
    </g>
  </g>

  <!-- mark + credit, centered, quiet -->
  <g font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">
    <text x="800" y="92" font-size="20" font-weight="300" letter-spacing="1" fill="#F4F3EF">AI-Ops</text>
    <rect x="770" y="106" width="60" height="1" fill="#6E7BFF" opacity="0.5"/>
    <text x="800" y="134" font-size="13" font-weight="400" letter-spacing="0.3" fill="#6A6D76">Built by Jenil · github.com/Jenil05-web</text>
    <text x="800" y="158" font-size="11.5" font-weight="500" letter-spacing="2.5" fill="#6E7BFF" style="text-transform:uppercase" opacity="0.75">AI-OPS OPEN BUILD LICENSE</text>
  </g>
</svg>
