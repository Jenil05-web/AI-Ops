<svg width="1600" height="170" viewBox="0 0 1600 170" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0A0B10"/>
      <stop offset="100%" stop-color="#0D0E16"/>
    </linearGradient>
    <linearGradient id="hairline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#6E7BFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#9AA3FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6E7BFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="fGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#6E7BFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6E7BFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="fBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="fBlurTiny" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="1600" height="170" fill="url(#fBgGrad)"/>

  <!-- ambient glow, a little bolder now -->
  <circle cx="800" cy="10" r="280" fill="url(#fGlow)" filter="url(#fBlur)">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="10s" repeatCount="indefinite"/>
  </circle>

  <!-- top hairline border with a slow traveling glow -->
  <line x1="0" y1="0" x2="1600" y2="0" stroke="#6E7BFF" stroke-opacity="0.1" stroke-width="1.2"/>
  <rect x="-360" y="-6" width="360" height="12" fill="url(#hairline)" filter="url(#fBlurTiny)" opacity="0.9">
    <animate attributeName="x" values="-360;1600;-360" dur="16s" repeatCount="indefinite"/>
  </rect>
  <rect x="-360" y="-1.5" width="360" height="3" fill="url(#hairline)">
    <animate attributeName="x" values="-360;1600;-360" dur="16s" repeatCount="indefinite"/>
  </rect>

  <!-- faint drifting particles, sparse -->
  <g fill="#AEB0B8">
    <circle cx="220" cy="50" r="1.6" opacity="0.25"><animate attributeName="opacity" values="0.05;0.45;0.05" dur="13s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="1380" cy="128" r="1.8" opacity="0.25"><animate attributeName="opacity" values="0.05;0.45;0.05" dur="15s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="1500" cy="46" r="1.5" opacity="0.25"><animate attributeName="opacity" values="0.05;0.4;0.05" dur="11s" begin="4s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="118" r="1.7" opacity="0.25"><animate attributeName="opacity" values="0.05;0.45;0.05" dur="14s" begin="1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- one small orbiting point, echoing the hero -->
  <g transform="translate(1460,84)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="50s" repeatCount="indefinite"/>
      <circle cx="20" cy="0" r="2" fill="#D9B26A" opacity="0.65"/>
    </g>
  </g>

  <!-- mark + credit, centered, larger and more legible -->
  <g font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">
    <text x="800" y="76" font-size="30" font-weight="300" letter-spacing="1" fill="#F4F3EF">AI-Ops</text>
    <rect x="762" y="93" width="76" height="1.6" fill="#6E7BFF" opacity="0.6"/>
    <text x="800" y="120" font-size="16" font-weight="400" letter-spacing="0.3" fill="#9497A1">Built by Jenil · github.com/Jenil05-web</text>
    <text x="800" y="146" font-size="12.5" font-weight="500" letter-spacing="2.8" fill="#8E9AFF" style="text-transform:uppercase" opacity="0.85">AI-OPS OPEN BUILD LICENSE</text>
  </g>
</svg>
