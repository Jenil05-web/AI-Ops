<svg width="1600" height="550" viewBox="0 0 1600 550" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#6E7BFF" stop-opacity="0"/>
      <stop offset="18%" stop-color="#6E7BFF" stop-opacity="0.65"/>
      <stop offset="52%" stop-color="#9AA3FF" stop-opacity="0.9"/>
      <stop offset="84%" stop-color="#6E7BFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6E7BFF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#6E7BFF" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#6E7BFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#D9B26A" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#D9B26A" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0A0B10"/>
      <stop offset="60%"  stop-color="#0B0C13"/>
      <stop offset="100%" stop-color="#0D0E16"/>
    </linearGradient>

    <filter id="blurSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="blurTiny" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>

  <!-- BASE -->
  <rect width="1600" height="550" fill="url(#bgGrad)"/>

  <!-- breathing ambient glow, right composition -->
  <circle cx="1160" cy="270" r="260" fill="url(#glow)" filter="url(#blurSoft)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1440" cy="440" r="150" fill="url(#goldGlow)" filter="url(#blurSoft)" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="13s" repeatCount="indefinite"/>
  </circle>

  <!-- ===== LAYER 1 — slow drifting contour lines, full bleed ===== -->
  <g stroke-width="1" fill="none">
    <g opacity="0.055" stroke="#AEB0B8">
      <path d="M -60,96 C 260,40 560,150 860,96 C 1160,42 1460,150 1660,96">
        <animateTransform attributeName="transform" type="translate" values="0,0;36,4;0,0" dur="46s" repeatCount="indefinite"/>
      </path>
    </g>
    <g opacity="0.05" stroke="#6E7BFF">
      <path d="M -60,196 C 320,150 520,250 900,196 C 1220,150 1480,250 1660,196">
        <animateTransform attributeName="transform" type="translate" values="0,0;-30,0;0,0" dur="54s" repeatCount="indefinite"/>
      </path>
    </g>
    <g opacity="0.06" stroke="#AEB0B8">
      <path d="M -60,462 C 300,410 600,512 900,462 C 1200,410 1500,512 1660,462">
        <animateTransform attributeName="transform" type="translate" values="0,0;40,-3;0,0" dur="50s" repeatCount="indefinite"/>
      </path>
    </g>
    <g opacity="0.045" stroke="#D9B26A">
      <path d="M 560,340 C 850,300 1050,380 1300,340 C 1450,318 1550,360 1660,338">
        <animateTransform attributeName="transform" type="translate" values="0,0;-24,2;0,0" dur="60s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- ===== LAYER 2 — the flowing ribbon (signature element) ===== -->
  <g>
    <path d="M 640,300 C 830,224 990,378 1180,286 C 1340,208 1450,336 1600,258"
          fill="none" stroke="#6E7BFF" stroke-width="7" opacity="0.18" filter="url(#blurSoft)"/>
    <path d="M 640,300 C 830,224 990,378 1180,286 C 1340,208 1450,336 1600,258"
          fill="none" stroke="url(#ribbonGrad)" stroke-width="1.6"
          stroke-dasharray="2 9" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" from="0" to="-220" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ===== LAYER 3 — constellation nodes + traveling light ===== -->
  <g stroke="#6E7BFF" stroke-width="1" fill="none" opacity="0.28">
    <path id="seg1" d="M 760,258 C 820,232 850,286 918,308"/>
    <path id="seg2" d="M 918,308 C 980,328 1020,262 1084,240"/>
    <path id="seg3" d="M 1084,240 C 1150,218 1190,296 1246,298"/>
    <path id="seg4" d="M 1246,298 C 1310,300 1350,232 1404,228"/>
    <path id="seg5" d="M 1404,228 C 1450,224 1480,266 1524,278"/>
  </g>
  <g fill="#C9CDFF">
    <circle cx="760" cy="258" r="2.6"/>
    <circle cx="918" cy="308" r="2.2"/>
    <circle cx="1084" cy="240" r="2.6"/>
    <circle cx="1246" cy="298" r="2.2"/>
    <circle cx="1404" cy="228" r="2.6"/>
    <circle cx="1524" cy="278" r="2.2"/>
  </g>
  <g fill="#EEF0FF">
    <circle r="2.4" opacity="0.9">
      <animateMotion dur="4.5s" begin="0s" repeatCount="indefinite">
        <mpath href="#seg1"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;0" dur="4.5s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.4" opacity="0.9">
      <animateMotion dur="4.5s" begin="0.9s" repeatCount="indefinite">
        <mpath href="#seg2"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;0" dur="4.5s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.4" opacity="0.9">
      <animateMotion dur="4.5s" begin="1.8s" repeatCount="indefinite">
        <mpath href="#seg3"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;0" dur="4.5s" begin="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.4" opacity="0.9">
      <animateMotion dur="4.5s" begin="2.7s" repeatCount="indefinite">
        <mpath href="#seg4"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;0" dur="4.5s" begin="2.7s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.4" opacity="0.9">
      <animateMotion dur="4.5s" begin="3.6s" repeatCount="indefinite">
        <mpath href="#seg5"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;0" dur="4.5s" begin="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ===== LAYER 4 — fine floating particles ===== -->
  <g fill="#AEB0B8">
    <circle cx="700" cy="120" r="1.4" opacity="0.3"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="11s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="440" r="1.8" opacity="0.25"><animate attributeName="opacity" values="0.1;0.4;0.1" dur="14s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="150" r="1.2" opacity="0.3"><animate attributeName="opacity" values="0.05;0.45;0.05" dur="9s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="1030" cy="420" r="1.6" opacity="0.25"><animate attributeName="opacity" values="0.1;0.4;0.1" dur="16s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="1140" cy="360" r="1.3" opacity="0.3"><animate attributeName="opacity" values="0.05;0.4;0.05" dur="12s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="1220" cy="150" r="1.7" opacity="0.25"><animate attributeName="opacity" values="0.1;0.45;0.1" dur="10s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="1300" cy="410" r="1.2" opacity="0.3"><animate attributeName="opacity" values="0.05;0.35;0.05" dur="15s" begin="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="1380" cy="130" r="1.5" opacity="0.25"><animate attributeName="opacity" values="0.1;0.4;0.1" dur="13s" begin="4s" repeatCount="indefinite"/></circle>
    <circle cx="1460" cy="360" r="1.4" opacity="0.3"><animate attributeName="opacity" values="0.05;0.45;0.05" dur="11s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="1540" cy="190" r="1.6" opacity="0.25"><animate attributeName="opacity" values="0.1;0.4;0.1" dur="17s" begin="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="1580" cy="400" r="1.2" opacity="0.3"><animate attributeName="opacity" values="0.05;0.35;0.05" dur="9.5s" begin="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="330" r="1.3" opacity="0.25"><animate attributeName="opacity" values="0.05;0.4;0.05" dur="12.5s" begin="1.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ===== LAYER 5 — two extremely slow orbiting points ===== -->
  <g transform="translate(1500,150)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="42s" repeatCount="indefinite"/>
      <circle cx="30" cy="0" r="2.2" fill="#6E7BFF" opacity="0.55"/>
    </g>
  </g>
  <g transform="translate(1420,470)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="58s" repeatCount="indefinite"/>
      <circle cx="22" cy="0" r="1.8" fill="#D9B26A" opacity="0.55"/>
    </g>
  </g>

  <!-- ===== TYPOGRAPHY — static, editorial, unhurried ===== -->
  <g font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif">
    <text x="112" y="150" font-size="12.5" font-weight="600" letter-spacing="4.2"
          fill="#6E7BFF" style="text-transform:uppercase">AUTONOMOUS TICKET INTELLIGENCE</text>

    <text x="110" y="252" font-size="104" font-weight="300" letter-spacing="-1"
          fill="#F4F3EF">AI-Ops</text>

    <rect x="113" y="278" width="58" height="1.5" fill="#6E7BFF" opacity="0.7"/>

    <text x="112" y="322" font-size="25" font-weight="400" letter-spacing="0.2"
          fill="#B9BBC4">An End-to-End AI Support Intelligence Platform</text>

    <text x="112" y="356" font-size="15.5" font-weight="400" fill="#6A6D76">
      <tspan x="112" dy="0">Autonomous support workflows powered by intelligent</tspan>
      <tspan x="112" dy="22">retrieval, reasoning, drafting, and orchestration.</tspan>
    </text>
  </g>
</svg>
