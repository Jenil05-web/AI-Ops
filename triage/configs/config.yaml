data:
  raw_dir: "data/raw"
  processed_path: "data/processed/tickets_clean.csv"
  embeddings_path: "data/processed/ticket_embeddings.npy"
  index_path: "data/processed/ticket_index.faiss"

model:
  dir: "models"
  max_features: 5000
  n_estimators: 200
  max_depth: 6
  learning_rate: 0.1

rag:
  embedding_model: "text-embedding-3-small"
  top_k: 3

llm:
  draft_model: "gpt-4o-mini"
  temperature: 0.3

api:
  host: "0.0.0.0"
  port: 8000
  